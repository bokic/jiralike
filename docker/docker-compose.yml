services:
  jiralike:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
    container_name: jiralike
    ports:
      - "8082:80"
    volumes:
      - jiralike_db:/var/lib/jiralike/db
      - jiralike_blobs:/var/lib/jiralike/blobs
    restart: unless-stopped

volumes:
  jiralike_db:
  jiralike_blobs:
